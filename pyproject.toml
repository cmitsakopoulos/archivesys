[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archivesys"
version = "0.3.0"
description = "Historical Family Archive & Timeline Projection Engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/ingestion/models/NOTICE.md"]
requires-python = ">=3.10"
authors = [
    { name = "ArchiveSys Maintainers" }
]
keywords = ["digital-humanities", "archive", "timeline", "ocr", "polytonic-greek", "edtf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Sociology :: History",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "Jinja2>=3.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
archivesys = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.database" = ["*.sql"]
"src.ingestion" = ["models/*"]
"src.visualizer" = ["templates/*.jinja2", "templates/*"]
"src.curation" = ["static/**/*", "static/*"]
